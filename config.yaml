# Fork of Vincentqyw/cv-arxiv-daily, customized as NewsCome arXiv pipeline
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "SulleyZhou"
repo_name: "arxiv-daily-pipeline"
show_authors: True
show_links: True
show_badge: False
max_results: 25

publish_readme: True
publish_gitpage: False
publish_wechat: False

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# keywords to search (arXiv queries are English)
keywords:
    "LLM":
        filters: ["Large Language Model", "LLM"]
    "Agent":
        filters: ["LLM Agent", "AI Agent", "Autonomous Agent", "Multi-Agent System"]
    "Multimodal":
        filters: ["Multimodal", "Multi-modal", "Vision-Language Model"]
    "RAG":
        filters: ["Retrieval-Augmented Generation", "RAG"]
